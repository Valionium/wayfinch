name: emergency

# The owner's two buttons, and a third that only looks (plan "If something goes wrong"). Only the owner runs this.
# It needs neither the approval environment nor green checks: it must work when everything else is broken.
on:
  workflow_dispatch:
    inputs:
      action:
        description: check only says where a rollback would go; rollback goes to the previous version; switch removes the offline worker from every phone (last resort)
        required: true
        type: choice
        options: [check, rollback, switch]
      version:
        description: Rollback only. A version id, to go somewhere other than the previous version. Leave empty otherwise
        required: false
        type: string
        default: ''
      also_release_main:
        description: Switch only. Tick only if the switch stopped, or the live commit won't build, and you want what main holds sent to riders too
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  LIVE_ORIGIN: https://load-check.valentin-hopstein.workers.dev
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    shell: bash

jobs:
  emergency:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci

      - id: pick
        name: Choose the version to go back to
        if: inputs.action == 'rollback' || inputs.action == 'check'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMED: ${{ inputs.version }}
          CHECK_ONLY: ${{ inputs.action == 'check' }}
        run: |
          npx wrangler deployments list --json > rows.json
          mkdir versions
          for id in $(node tools/deploy-check.mjs --rollback-candidates rows.json); do
            npx wrangler versions view "$id" --json > "versions/$id.json" || rm -f "versions/$id.json"
          done
          version=$(node tools/deploy-check.mjs --pick-rollback rows.json --named "$NAMED" --versions-dir versions --check-only "$CHECK_ONLY")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Say where a rollback would go, and stop
        if: inputs.action == 'check'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          echo "A rollback would go to $VERSION. Nothing was changed." | tee -a "$GITHUB_STEP_SUMMARY"
          live=$(node tools/deploy-check.mjs --live-version rows.json)
          commit=$(node tools/deploy-check.mjs --commit-of "versions/$live.json")
          if [ -n "$commit" ]; then echo "A switch would build from commit $commit."; else echo 'No commit known, so a switch would build from `main`.'; fi | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the live list, to see it change
        if: inputs.action == 'rollback'
        run: node tools/deploy-check.mjs --save-live-list before-list.txt --origin "$LIVE_ORIGIN"
      - id: rollback
        name: Roll back
        if: inputs.action == 'rollback'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: npx wrangler rollback "$VERSION" --yes --message "Emergency rollback from Run workflow"
      - id: confirm
        name: Confirm Cloudflare has the version that was picked
        if: steps.rollback.outcome == 'success'
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          npx wrangler deployments list --json > rows-after.json
          now=$(node tools/deploy-check.mjs --live-version rows-after.json)
          if [ "$now" != "$VERSION" ]; then
            echo "Cloudflare says $now is live, not the picked version." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Compare the live site with its own new list
        if: steps.rollback.outcome == 'success'
        run: node tools/deploy-check.mjs --self --origin "$LIVE_ORIGIN" --changed-from before-list.txt

      # The switch changes only the worker: its page is the commit that is live, not whatever main holds now.
      - id: source
        name: Find the commit that is live
        if: inputs.action == 'switch'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALSO_RELEASE_MAIN: ${{ inputs.also_release_main }}
        run: |
          npx wrangler deployments list --json > rows.json || true
          live=$(node tools/deploy-check.mjs --live-version rows.json)
          if [ -n "$live" ]; then
            npx wrangler versions view "$live" --json > live-version.json || rm -f live-version.json
          fi
          commit=$(node tools/deploy-check.mjs --commit-of live-version.json)
          # The way out when the live commit won't build: main, through the guard's list.
          if [ "$ALSO_RELEASE_MAIN" = true ]; then commit=""; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ -n "$commit" ]; then echo "dir=live-commit" >> "$GITHUB_OUTPUT"; else echo "dir=." >> "$GITHUB_OUTPUT"; fi
      - name: Check out the commit that is live
        if: inputs.action == 'switch' && steps.source.outputs.commit != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: live-commit
          persist-credentials: false
      - name: Install what that commit needs
        if: inputs.action == 'switch' && steps.source.outputs.commit != ''
        working-directory: live-commit
        run: npm ci
      - name: Build the emergency worker
        if: inputs.action == 'switch'
        working-directory: ${{ steps.source.outputs.dir }}
        run: node tools/build.mjs --emergency
      - name: Check the emergency build
        if: inputs.action == 'switch'
        env:
          BUILD_DIR: ${{ steps.source.outputs.dir }}
        run: node tools/deploy-check.mjs --check-emergency "$BUILD_DIR/dist"
      - id: guard
        name: With no commit known, stop if main would change more than the worker
        if: inputs.action == 'switch' && steps.source.outputs.commit == ''
        env:
          ALSO_RELEASE_MAIN: ${{ inputs.also_release_main }}
        run: node tools/deploy-check.mjs --switch-guard --build dist/build.json --origin "$LIVE_ORIGIN" --also-release-main "$ALSO_RELEASE_MAIN"
      - id: switch
        name: Upload the switch
        if: inputs.action == 'switch'
        timeout-minutes: 10
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILT_FROM: ${{ steps.source.outputs.commit || github.sha }}
        run: npx wrangler deploy --tag emergency-switch --message "emergency-switch from Run workflow, commit $BUILT_FROM"
      - name: Compare the live site with the switch
        if: steps.switch.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.source.outputs.dir }}
        run: node tools/deploy-check.mjs --build "$BUILD_DIR/dist/build.json" --origin "$LIVE_ORIGIN"

      - name: Say what stays on main, and what riders have now
        if: always() && (steps.rollback.outcome == 'success' || steps.switch.outcome == 'success')
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ steps.pick.outputs.version }}
          BUILT_FROM: ${{ steps.source.outputs.commit || github.sha }}
          BUILT_KIND: ${{ steps.guard.outputs.kind || 'live' }}
        run: node tools/deploy-check.mjs --summary "$ACTION" --version "$VERSION" --built-from "$BUILT_FROM" --built-kind "$BUILT_KIND"
      - name: Say plainly what did and didn't happen
        if: failure()
        env:
          ACTION: ${{ inputs.action }}
          ACTED: ${{ steps.rollback.outcome == 'success' || steps.switch.outcome == 'success' }}
        run: node tools/deploy-check.mjs --failure-summary "$ACTION" --acted "$ACTED"
