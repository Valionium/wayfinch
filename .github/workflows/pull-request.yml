name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: npm run rules

  unit-property:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run unit
      - run: npm run sim -- --seed 20261030 --count 1000

  load-check-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run qa

  # The browser tests in parts side by side (plan Task 23: over 6 minutes in one; three parts grew to 9-12 minutes and were
  # cut off at their limit with no failing test), and the budgets alone, so nothing else runs on the machine while they are timed.
  # The two phone projects (processor slowed to a quarter) have four parts of their own with one worker, so no second test shares
  # the machine (the owner's choice of 15 November 2026: a slowed page that shared it sometimes stopped answering for a minute);
  # every other project runs in two parts with two workers. The job limit is 15 so a slow browser install cannot cut a part off.
  # The check a merge needs stays `browser`, which waits for every part in this matrix.
  browser-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: ['1/2', '2/2', 'phone 1/4', 'phone 2/4', 'phone 3/4', 'phone 4/4', 'budgets']
    env:
      WAYFINCH_SHARDED: '1'
    steps:
      - uses: actions/checkout@v7
      # legacySite() reads the page as it was live from this tag; a shallow checkout doesn't have it.
      - run: git fetch --depth=1 origin +refs/tags/load-check-zip-2026-10-30:refs/tags/load-check-zip-2026-10-30
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright's browsers and its system libraries, each cached by the installed Playwright version (a miss costs one download).
      # Why: `install --with-deps` ran apt on every job, and when Azure's Ubuntu mirror was slow that took 6-10 minutes before any test.
      - id: pw
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
      - id: pw-browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox
      - if: steps.pw-browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox
      - if: steps.pw-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-browsers.outputs.cache-primary-key }}
      - id: pw-debs
        uses: actions/cache/restore@v5
        with:
          path: ~/pw-debs
          key: playwright-debs-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium-firefox
      - name: System libraries for the browsers
        run: |
          if [ "${{ steps.pw-debs.outputs.cache-hit }}" = true ] && sudo dpkg -i ~/pw-debs/*.deb; then
            echo "Installed from the cached packages."
          else
            npx playwright install-deps chromium firefox
            mkdir -p ~/pw-debs && cp /var/cache/apt/archives/*.deb ~/pw-debs/ || true
          fi
      - if: steps.pw-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/pw-debs
          key: ${{ steps.pw-debs.outputs.cache-primary-key }}
      - run: npm run build
      # A part that ran no test at all fails: an empty shard once went green.
      - run: |
          part="${{ matrix.part }}"
          if [ "$part" = budgets ]; then npx playwright test --project=app-budgets --reporter=list,json
          elif [ "${part#phone }" != "$part" ]; then
            npx playwright test --project=app-phone --project=app-phone-light --workers=1 --shard="${part#phone }" --grep-invert '\[PERF-' --reporter=list,json
          else WAYFINCH_PHONE_APART=1 npx playwright test --shard="$part" --grep-invert '\[PERF-' --reporter=list,json; fi
          node -e "const s = require('./pw.json').stats; if (!(s.expected + s.unexpected + s.flaky > 0)) { console.error('This part ran no test.'); process.exit(1); }"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: pw.json
      # A failed part keeps what Playwright saved of its failed tests (the trace and screenshot of playwright.config.ts) for a week:
      # `gh run download <run id>` fetches it, `npx playwright show-trace <trace.zip>` opens it.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
  # WebKit's smoke set (plan Decision 1): it runs on every pull request, is not a required check, and `browser` does not wait for it.
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright's browsers and its system libraries, each cached by the installed Playwright version (a miss costs one download).
      # Why: `install --with-deps` ran apt on every job, and when Azure's Ubuntu mirror was slow that took 6-10 minutes before any test.
      - id: pw
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
      - id: pw-browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit
      - if: steps.pw-browsers.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - if: steps.pw-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-browsers.outputs.cache-primary-key }}
      - id: pw-debs
        uses: actions/cache/restore@v5
        with:
          path: ~/pw-debs
          key: playwright-debs-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-webkit
      - name: System libraries for the browsers
        run: |
          if [ "${{ steps.pw-debs.outputs.cache-hit }}" = true ] && sudo dpkg -i ~/pw-debs/*.deb; then
            echo "Installed from the cached packages."
          else
            npx playwright install-deps webkit
            mkdir -p ~/pw-debs && cp /var/cache/apt/archives/*.deb ~/pw-debs/ || true
          fi
      - if: steps.pw-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/pw-debs
          key: ${{ steps.pw-debs.outputs.cache-primary-key }}
      - run: npx playwright test --project=app-webkit-smoke
        env:
          WAYFINCH_WEBKIT: '1'
  browser:
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.browser-shard.result }}" = success
