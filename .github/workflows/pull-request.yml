name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run lint
      - run: npm run rules

  unit-property:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run unit
      - run: npm run sim -- --seed 20261030 --count 1000

  load-check-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run qa

  # The browser tests in four parts side by side (plan Task 23: over 6 minutes in one; three parts grew to 9-12 minutes and were
  # cut off at their limit with no failing test), and the budgets alone, so nothing else runs on the machine while they are timed.
  # The job limit is 15 so a slow browser install cannot cut a part off. The check a merge needs stays `browser`, which waits
  # for every part in this matrix.
  browser-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: ['1/4', '2/4', '3/4', '4/4', 'budgets']
    env:
      WAYFINCH_SHARDED: '1'
    steps:
      - uses: actions/checkout@v7
      # legacySite() reads the page as it was live from this tag; a shallow checkout doesn't have it.
      - run: git fetch --depth=1 origin +refs/tags/load-check-zip-2026-10-30:refs/tags/load-check-zip-2026-10-30
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      # A part that ran no test at all fails: an empty shard once went green.
      - run: |
          if [ "${{ matrix.part }}" = budgets ]; then npx playwright test --project=app-budgets --reporter=list,json
          else npx playwright test --shard=${{ matrix.part }} --grep-invert '\[PERF-' --reporter=list,json; fi
          node -e "const s = require('./pw.json').stats; if (!(s.expected + s.unexpected + s.flaky > 0)) { console.error('This part ran no test.'); process.exit(1); }"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: pw.json
  # WebKit's smoke set (plan Decision 1): it runs on every pull request, is not a required check, and `browser` does not wait for it.
  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=app-webkit-smoke
        env:
          WAYFINCH_WEBKIT: '1'
  browser:
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.browser-shard.result }}" = success
