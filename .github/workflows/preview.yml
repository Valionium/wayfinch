name: preview

# One Run workflow click by the owner: main with the launch switch on, uploaded as a version with its own address.
# It uploads a version and never deploys one, so riders see nothing. Agents never run this. Plan Decision 6.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    shell: bash

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: node tools/build.mjs --launch=on
      - name: Upload a version, not live
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --message "Preview of main" | tee upload.txt
          address=$(grep 'Version Preview URL' upload.txt | grep -o 'https://[^ ]*' || true)
          echo "Preview address: ${address:-not printed, see the log of this step}" | tee -a "$GITHUB_STEP_SUMMARY"
