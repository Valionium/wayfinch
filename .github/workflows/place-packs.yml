name: Place packs

# Weekly on Tuesdays at 03:17 UTC, or by hand. Only the deploy step of the publish job has secrets.
on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:
    inputs:
      countries:
        description: Country codes, separated by commas
        type: string
        default: DE,DK,PL,CZ,AT,CH,FR,LU,BE,NL
      publish:
        description: Publish the build to the data host
        type: boolean
        default: false
      force_fail:
        description: Test only, a country code whose job is made to fail
        type: string
        default: ''

permissions:
  contents: read

# Runs never overlap: two merges would meddle with the same stored files.
concurrency:
  group: place-packs
  cancel-in-progress: false

jobs:
  # No needs, so a failing country cannot stop it. Re-enables the other schedule and makes no commit.
  keep-alive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-alive.yml/enable"

  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          COUNTRIES: ${{ inputs.countries }}
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          list=$(echo "$COUNTRIES,$FORCE_FAIL" | tr -d ' ' | tr ',' '\n' | grep -E '^(DE|DK|PL|CZ|AT|CH|FR|LU|BE|NL)$' | sort -u | jq -R . | jq -sc '{cc: .}')
          if [ "$list" = '{"cc":[]}' ]; then echo "No known country code in the input"; exit 1; fi
          echo "matrix=$list" >> "$GITHUB_OUTPUT"

  country:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Stop at once when this country is the test-only forced failure
        env:
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          if [ "$FORCE_FAIL" = "${{ matrix.cc }}" ]; then echo "Forced failure for ${{ matrix.cc }} (test only)"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: osmium --version
      - run: df -h /
      - run: node --max-old-space-size=12000 pipeline/country.ts ${{ matrix.cc }} --built-on "$(date -u +%F)"
      - run: df -h /
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        with:
          name: country-${{ matrix.cc }}
          path: pipeline/out/country-*.json.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: place-pack-build
          path: pipeline/build
      - name: Prepare the folder and store the archive
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node pipeline/publish-prepare.ts
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project list | grep -q wayfinch-data || npx wrangler pages project create wayfinch-data --production-branch=main
          npx wrangler pages deploy pipeline/out/deploy --project-name=wayfinch-data --branch=main --commit-dirty=true
      - name: Read the live data back
        env:
          ADDRESS: ${{ vars.PACKS_ADDRESS || 'https://wayfinch-data.pages.dev' }}
          BUILD_ID: ${{ steps.prepare.outputs.build_id }}
        run: node pipeline/check-live.ts "$ADDRESS" "$BUILD_ID"

  merge:
    needs: country
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: country-*
          path: pipeline/in
      - name: Merge the countries into one build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --max-old-space-size=12000 pipeline/merge.ts \
            --build-id "$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --size-report
      - uses: actions/upload-artifact@v7
        with:
          name: place-pack-build
          path: pipeline/build
          retention-days: 7
          if-no-files-found: error

  report:
    needs: [country, merge, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: place-pack-build
          path: pipeline/build
      - name: Open or update the one issue, when something needs a look
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRY_RESULT: ${{ needs.country.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node pipeline/report.ts
