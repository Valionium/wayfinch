name: Place packs

# Started by hand for now: no schedule, no secrets, no publish.
on:
  workflow_dispatch:
    inputs:
      countries:
        description: Country codes, separated by commas
        type: string
        default: DE,DK,PL,CZ,AT,CH,FR,LU,BE,NL

permissions:
  contents: read

# Runs never overlap: two merges would meddle with the same stored files.
concurrency:
  group: place-packs
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          list=$(echo "$COUNTRIES" | tr -d ' ' | tr ',' '\n' | grep -E '^(DE|DK|PL|CZ|AT|CH|FR|LU|BE|NL)$' | sort -u | jq -R . | jq -sc '{cc: .}')
          if [ "$list" = '{"cc":[]}' ]; then echo "No known country code in the input"; exit 1; fi
          echo "matrix=$list" >> "$GITHUB_OUTPUT"

  country:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: osmium --version
      - run: df -h /
      - run: node --max-old-space-size=12000 pipeline/country.ts ${{ matrix.cc }} --built-on "$(date -u +%F)"
      - run: df -h /
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        with:
          name: country-${{ matrix.cc }}
          path: pipeline/out/country-*.json.gz
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: country
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: country-*
          path: pipeline/in
      - name: Merge the countries into one build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --max-old-space-size=12000 pipeline/merge.ts \
            --build-id "$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --size-report
      - uses: actions/upload-artifact@v7
        with:
          name: place-pack-build
          path: pipeline/build
          retention-days: 7
          if-no-files-found: error
